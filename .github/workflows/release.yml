# Publishes a signed release for the Terraform Registry on every v* tag (git tag v0.1.0 && git push origin v0.1.0).
# Secrets (Settings > Secrets and variables > Actions):
#   GPG_PRIVATE_KEY  the ASCII-armored private signing key (its public key is registered in the Registry namespace)
#   PASSPHRASE       its passphrase
# The Registry picks the release up through its GitHub webhook within minutes.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test ./...
        env:
          TF_ACC: ""

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
