# GoReleaser for the Terraform Registry (from HashiCorp's provider scaffolding): zip per platform,
# SHA256SUMS, a detached GPG signature of SHA256SUMS and the registry manifest (protocol 6.0).
# Run by .github/workflows/release.yml on a v* tag. Local dry run without signing:
#   goreleaser release --snapshot --clean --skip=sign,publish
version: 2
project_name: terraform-provider-awacino

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # the key is imported by crazy-max/ghaction-import-gpg from the GPG_PRIVATE_KEY secret
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # the Registry reads the release; CHANGELOG.md is the change list
  draft: false

changelog:
  disable: true
